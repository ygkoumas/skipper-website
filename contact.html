      <div id="fh5co-contact">
        <div class="container">
          <div class="row animate-box">
            <div
              class="col-md-6 col-md-offset-3 text-center fh5co-heading"
              style="margin-bottom: 3em; margin-top: 1em"
            >
              <h2>Get In Touch</h2>
            </div>
          </div>
        </div>

        <div class="container">
          <div class="row">
            <div class="col-md-6 animate-box" style="padding-bottom: 20px">
              <img
                alt="contact"
                class="img-responsive"
                src="/images/contact.jpg"
              />
            </div>
            <div class="col-md-6 animate-box">
              <!-- Include Forminit SDK -->
              <script src="https://forminit.com/sdk/v1/forminit.js"></script>

              <form id="contact-form" autocomplete="off">
                <div class="row form-group">
                  <div class="col-md-12">
                    <!-- <label for="email">Email</label> -->
                    <input
                      type="text"
                      name="fi-sender-firstName"
                      id="name"
                      class="form-control"
                      placeholder="Name"
                    />
                  </div>
                </div>

                <div class="row form-group">
                  <div class="col-md-12">
                    <!-- <label for="email">Email</label> -->
                    <input
                      type="text"
                      name="fi-sender-email"
                      id="email"
                      class="form-control"
                      placeholder="Email"
                      required
                    />
                  </div>
                </div>

                <div class="row form-group">
                  <div class="col-md-12">
                    <!-- <label for="subject">Subject</label> -->
                    <input
                      type="text"
                      name="fi-sender-lastName"
                      id="subject"
                      class="form-control"
                      placeholder="Subject"
                      value="Booking Holidays"
                    />
                  </div>
                </div>

                <div class="row form-group">
                  <div class="col-md-12">
                    <!-- <label for="message">Message</label> -->
                    <textarea
                      name="fi-text-message"
                      id="message"
                      cols="30"
                      rows="10"
                      class="form-control"
                      placeholder="Message"
                    ></textarea>
                  </div>
                </div>
                <div class="form-group">
                  <button type="submit" class="btn btn-primary">
                    Send Message
                  </button>
                </div>
              </form>
              <div id="result" style="font-size: 21px; color: #444"></div>

              <script>
                const forminit = new Forminit();
                const FORM_ID = "h9kzymhmj09";

                document
                  .getElementById("contact-form")
                  .addEventListener("submit", async (e) => {
                    e.preventDefault();

                    const formData = new FormData(e.target);
                    const { data, error } = await forminit.submit(
                      FORM_ID,
                      formData,
                    );

                    const result = document.getElementById("result");

                    if (error) {
                      result.textContent = error.message;
                      return;
                    }

                    result.textContent = "Message sent successfully!";
                    e.target.reset();
                  });
              </script>
            </div>
          </div>
        </div>
